services:
  mongo:
    image: mongo:7
    container_name: firms_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: firms_api
    ports:
      - "5050:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=firms_colombia
    depends_on:
      - mongo

volumes:
  mongo_data:

networks:
  default:
    name: firms_network
