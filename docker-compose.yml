services:
  mongo:
    image: mongo:7
    container_name: firms_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: firms_api
    ports:
      - "5050:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=firms_colombia
    depends_on:
      - mongo

  spark-master:
    build: ./spark
    image: firms-spark
    container_name: firms_spark_master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8081:8080"

  spark-worker:
    build: ./spark
    image: firms-spark
    container_name: firms_spark_worker
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    ports:
      - "8082:8081"
    depends_on:
      - spark-master

  dask-scheduler:
    build: ./dask
    image: firms-dask
    container_name: firms_dask_scheduler
    command: dask scheduler --port 8786 --dashboard-address :8787
    ports:
      - "8787:8787"

  dask-worker-1:
    build: ./dask
    image: firms-dask
    container_name: firms_dask_worker_1
    command: dask worker tcp://dask-scheduler:8786 --nworkers 1 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler

  dask-worker-2:
    build: ./dask
    image: firms-dask
    container_name: firms_dask_worker_2
    command: dask worker tcp://dask-scheduler:8786 --nworkers 1 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler

volumes:
  mongo_data:

networks:
  default:
    name: firms_network
